line-length = 88
target-version = "py311"

[lint]
select = ["E", "F", "W", "I"]
ignore = []

exclude = [
    "backend/app.py",
    "backend/config.py",
    "backend/routes",
    "backend/services",
    "backend/data",
    "backend/flask_app_legacy.py",
    "backend/workers/celery_app.py",  # temp - has line length issues
]

[lint.isort]
known-first-party = ["app"]