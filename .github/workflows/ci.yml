name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: krishilink
          POSTGRES_PASSWORD: krishilink
          POSTGRES_DB: krishilink_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U krishilink" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python -m ruff check app
        working-directory: backend
      - run: python -m mypy app --ignore-missing-imports || true
        working-directory: backend
      - env:
          DATABASE_URL: postgresql+psycopg://krishilink:krishilink@localhost:5432/krishilink_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret-32chars-long-xyz!!
        run: |
          alembic -c alembic.ini upgrade head
          pytest -v
          python -m alembic downgrade base || true
          python -m alembic upgrade head
        working-directory: backend
      - run: docker build -f backend/Dockerfile -t krishilink-backend:ci backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
        working-directory: frontend
      - run: npm run lint || true
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
