<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bgCotton" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </radialGradient>
    <radialGradient id="bollWhite" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="16" fill="url(#bgCotton)"/>
  <!-- Stem -->
  <path d="M 50,88 Q 52,70 48,55" stroke="url(#stemGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M 49,65 Q 60,60 68,64" stroke="url(#stemGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Dried Bracts (Calyx) -->
  <path d="M 48,58 Q 30,55 22,48 Q 32,45 42,50 Z" fill="#78350F"/>
  <path d="M 50,58 Q 50,72 56,76 Q 54,65 52,56 Z" fill="#92400E"/>
  <path d="M 50,58 Q 70,58 78,50 Q 68,46 56,52 Z" fill="#78350F"/>
  <path d="M 48,55 Q 35,32 30,22 Q 42,32 46,50 Z" fill="#92400E"/>
  <path d="M 52,55 Q 65,32 70,22 Q 58,32 54,50 Z" fill="#92400E"/>
  <!-- Cotton Fluffs / Bolls -->
  <circle cx="38" cy="42" r="14" fill="url(#bollWhite)" stroke="#CBD5E1" stroke-width="0.5"/>
  <circle cx="62" cy="42" r="14" fill="url(#bollWhite)" stroke="#CBD5E1" stroke-width="0.5"/>
  <circle cx="50" cy="30" r="15" fill="url(#bollWhite)" stroke="#CBD5E1" stroke-width="0.5"/>
  <circle cx="50" cy="46" r="15" fill="url(#bollWhite)" stroke="#CBD5E1" stroke-width="0.5"/>
  <circle cx="42" cy="36" r="10" fill="#FFFFFF" opacity="0.9"/>
</svg>
