<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bgMaize" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </radialGradient>
    <linearGradient id="cornCob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="huskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#4D7C0F"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="16" fill="url(#bgMaize)"/>
  <!-- Corn cob body -->
  <path d="M 38,72 C 32,45 42,22 56,18 C 66,22 72,45 66,72 C 60,78 44,78 38,72 Z" fill="url(#cornCob)" stroke="#D97706" stroke-width="1"/>
  <!-- Corn kernels grid lines -->
  <path d="M 43,26 Q 52,28 61,26 M 40,34 Q 52,37 64,34 M 38,42 Q 52,45 66,42 M 38,50 Q 52,53 66,50 M 39,58 Q 52,61 65,58 M 41,66 Q 52,69 63,66" stroke="#B45309" stroke-width="1.2" fill="none"/>
  <path d="M 48,22 L 46,74 M 54,20 L 54,75 M 60,24 L 62,73" stroke="#B45309" stroke-width="1.2" fill="none"/>
  <!-- Silk on top -->
  <path d="M 52,18 Q 45,8 40,12 M 55,18 Q 58,6 64,10 M 56,18 Q 62,10 68,14" stroke="#A16207" stroke-width="1.5" fill="none"/>
  <!-- Green Husk leaves wrapping around -->
  <path d="M 30,86 Q 22,50 36,36 Q 38,56 46,78 Z" fill="url(#huskGrad)" stroke="#365314" stroke-width="1"/>
  <path d="M 72,86 Q 80,50 66,36 Q 64,56 56,78 Z" fill="url(#huskGrad)" stroke="#365314" stroke-width="1"/>
  <!-- Stalk base -->
  <path d="M 48,76 L 48,92 C 48,94 54,94 54,92 L 54,76 Z" fill="#65A30D" stroke="#365314" stroke-width="1"/>
</svg>
