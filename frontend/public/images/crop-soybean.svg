<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bgSoy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </radialGradient>
    <linearGradient id="podGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#65A30D"/>
    </linearGradient>
    <linearGradient id="beanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="16" fill="url(#bgSoy)"/>
  <!-- Pod 1 -->
  <path d="M 20,65 Q 40,25 78,32 Q 55,55 35,78 Q 24,76 20,65 Z" fill="url(#podGrad)" stroke="#4D7C0F" stroke-width="1.5"/>
  <!-- Pod 2 opening -->
  <path d="M 30,70 Q 50,40 85,45 Q 65,70 42,84 Z" fill="#4D7C0F" opacity="0.8"/>
  <path d="M 33,68 Q 50,42 82,46" stroke="#A3E635" stroke-width="2" fill="none"/>
  <!-- Beans inside/around -->
  <ellipse cx="42" cy="62" rx="7" ry="5.5" fill="url(#beanGrad)" transform="rotate(-25 42 62)" stroke="#A16207" stroke-width="1"/>
  <ellipse cx="58" cy="53" rx="7" ry="5.5" fill="url(#beanGrad)" transform="rotate(-20 58 53)" stroke="#A16207" stroke-width="1"/>
  <ellipse cx="72" cy="46" rx="6.5" ry="5" fill="url(#beanGrad)" transform="rotate(-15 72 46)" stroke="#A16207" stroke-width="1"/>
  <!-- Loose beans -->
  <ellipse cx="28" cy="40" rx="7" ry="5.5" fill="url(#beanGrad)" transform="rotate(30 28 40)" stroke="#A16207" stroke-width="1"/>
  <ellipse cx="68" cy="74" rx="7" ry="5.5" fill="url(#beanGrad)" transform="rotate(-40 68 74)" stroke="#A16207" stroke-width="1"/>
  <!-- Leaf -->
  <path d="M 22,35 Q 12,18 35,20 Q 38,32 22,35 Z" fill="#65A30D" stroke="#365314" stroke-width="1"/>
</svg>
